<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GopenVPN Gateway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        :root {
            --bg-dark: #0b0f19;
            --bg-gradient: radial-gradient(circle at top left, #1a1c29, #0b0f19);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-bg-hover: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --danger: #ff4b4b;
            --success: #00ff88;
            --warning: #ffb800;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        /* Ambient Glow Effects */
        .ambient-glow {
            position: fixed;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            top: -20vh;
            left: -20vw;
            z-index: -1;
            pointer-events: none;
        }

        .ambient-glow.right {
            background: radial-gradient(circle, rgba(0, 242, 254, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
            top: auto;
            bottom: -20vh;
            left: auto;
            right: -20vw;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-main), var(--text-muted));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--accent-secondary);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Glass Card Base */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* Status Section */
        .status-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--glass-border);
            transition: background 0.5s ease;
        }

        .status-card.connected::before {
            background: var(--success);
            box-shadow: 0 0 15px var(--success);
        }

        .status-card.connecting::before {
            background: var(--warning);
            box-shadow: 0 0 15px var(--warning);
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-muted);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .connected .status-indicator {
            background: var(--success);
            box-shadow: 0 0 0 4px rgba(0, 255, 136, 0.2), 0 0 12px var(--success);
        }

        .connecting .status-indicator {
            background: var(--warning);
            box-shadow: 0 0 0 4px rgba(255, 184, 0, 0.2);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(255, 75, 75, 0.1);
            box-shadow: 0 8px 20px rgba(255, 75, 75, 0.2);
        }

        .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .btn-danger .loader {
            border-color: rgba(255, 75, 75, 0.2);
            border-top-color: var(--danger);
        }

        .btn.loading .loader {
            display: block;
        }

        .btn.loading span {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Proxies Section */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title svg {
            width: 20px;
            height: 20px;
            color: var(--accent-secondary);
        }

        .proxy-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .proxy-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .proxy-card:hover {
            background: var(--glass-bg-hover);
        }

        .proxy-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .proxy-port {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .proxy-port::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        .proxy-target {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .proxy-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .icon-btn.delete:hover {
            color: var(--danger);
            border-color: rgba(255, 75, 75, 0.3);
            background: rgba(255, 75, 75, 0.1);
        }

        /* Add Proxy Form */
        .add-proxy-form {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .input-glass {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px;
            font-size: 14px;
            outline: none;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .input-glass:focus {
            background: rgba(255, 255, 255, 0.05);
        }

        .input-glass::placeholder {
            color: #4a5568;
        }

        .btn-small {
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 8px;
            width: auto;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .add-proxy-form {
                grid-template-columns: 1fr;
            }

            .add-proxy-form .btn-small {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow right"></div>

    <div class="app-container">
        <div class="header">
            <h1>GopenVPN</h1>
            <p>Secure Gateway</p>
        </div>

        <div class="glass-card status-card" id="statusCard">
            <div class="status-header">
                <div class="status-indicator"></div>
                <span id="statusText">Disconnected</span>
            </div>

            <button class="btn" id="btnConnect" onclick="startVPN()">
                <span>Connect VPN</span>
                <div class="loader"></div>
            </button>

            <a class="btn" id="btnAuth" target="_blank"
                style="display: none; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; text-decoration: none;">
                <span>Authenticate</span>
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
            </a>

            <button class="btn btn-danger" id="btnDisconnect" onclick="stopVPN()" style="display: none;">
                <span>Disconnect</span>
                <div class="loader"></div>
            </button>
        </div>

        <div class="glass-card">
            <h3 class="section-title">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                </svg>
                Port Forwarding
            </h3>

            <div class="proxy-list" id="proxyList">
                <div style="text-align: center; color: var(--text-muted); padding: 20px;">Loading...</div>
            </div>

            <div class="add-proxy-form">
                <input type="number" id="proxyPort" class="input-glass" placeholder="Port" min="1" max="65535">
                <input type="text" id="proxyTarget" class="input-glass" placeholder="Target URL (e.g. localhost:3000)">
                <button class="btn btn-small" onclick="addProxy()">
                    <svg style="width:16px;height:16px;margin-right:4px;" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span id="btnSubmitText">Add</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const btnAuth = document.getElementById('btnAuth');
        const statusCard = document.getElementById('statusCard');
        const statusText = document.getElementById('statusText');

        setInterval(updateStatus, 2000);

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.connected) {
                    setUIState('connected');
                } else if (statusCard.classList.contains('connected')) {
                    setUIState('disconnected');
                }
            } catch (e) {
                console.error("Error fetching status", e);
            }
        }

        function setUIState(state, authUrl = null) {
            statusCard.className = `glass-card status-card ${state}`;
            btnConnect.classList.remove('loading');
            btnDisconnect.classList.remove('loading');

            btnConnect.style.display = 'none';
            btnDisconnect.style.display = 'none';
            btnAuth.style.display = 'none';

            if (state === 'connected') {
                statusText.innerText = 'VPN Connected';
                btnDisconnect.style.display = 'flex';
            } else if (state === 'connecting') {
                statusText.innerText = 'Starting...';
                btnConnect.style.display = 'flex';
                btnConnect.classList.add('loading');
            } else if (state === 'auth_required') {
                statusText.innerText = 'Authentication Required';
                btnAuth.href = authUrl;
                btnAuth.style.display = 'flex';
                statusCard.className = `glass-card status-card connecting`;
            } else {
                statusText.innerText = 'Disconnected';
                btnConnect.style.display = 'flex';
            }
        }

        async function startVPN() {
            if (btnConnect.classList.contains('loading')) return;
            setUIState('connecting');

            try {
                const res = await fetch('/api/start', { method: 'POST' });
                const data = await res.json();

                if (data.url) {
                    setUIState('auth_required', data.url);
                } else if (data.status === 'connected') {
                    setUIState('connected');
                } else {
                    alert('Error: ' + (data.error || 'Could not start'));
                    setUIState('disconnected');
                }
            } catch (e) {
                alert('Backend connection failed.');
                setUIState('disconnected');
            }
        }

        async function stopVPN() {
            if (btnDisconnect.classList.contains('loading')) return;
            btnDisconnect.classList.add('loading');
            try {
                await fetch('/api/stop', { method: 'POST' });
            } catch (e) { }
        }

        async function fetchProxies() {
            try {
                const res = await fetch('/api/proxies');
                const rules = await res.json();
                const list = document.getElementById('proxyList');
                list.innerHTML = '';

                if (rules && rules.length > 0) {
                    rules.forEach(rule => {
                        list.innerHTML += `
                            <div class="proxy-card">
                                <div class="proxy-info">
                                    <div class="proxy-port">Port ${rule.port}</div>
                                    <div class="proxy-target">${rule.target}</div>
                                </div>
                                <div class="proxy-actions">
                                    <button class="icon-btn" onclick="editProxy(${rule.port}, '${rule.target}')" title="Edit">
                                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                    </button>
                                    <button class="icon-btn delete" onclick="deleteProxy(${rule.port})" title="Delete">
                                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">No forwarded ports active</div>';
                }
            } catch (e) { }
        }

        async function addProxy() {
            const portInput = document.getElementById('proxyPort');
            const targetInput = document.getElementById('proxyTarget');
            const port = parseInt(portInput.value);
            let target = targetInput.value.trim();

            if (!port || !target) {
                alert("Please provide both port and target URL.");
                return;
            }
            if (!target.startsWith('http://') && !target.startsWith('https://')) {
                target = 'http://' + target;
            }

            try {
                const res = await fetch('/api/proxies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ port, target })
                });

                if (res.ok) {
                    portInput.value = '';
                    targetInput.value = '';
                    document.getElementById('btnSubmitText').innerText = 'Add';
                    fetchProxies();
                } else {
                    const err = await res.text();
                    alert("Error saving proxy: " + err);
                }
            } catch (e) {
                alert("Error connecting to server.");
            }
        }

        function editProxy(port, target) {
            document.getElementById('proxyPort').value = port;
            document.getElementById('proxyTarget').value = target;
            document.getElementById('btnSubmitText').innerText = 'Save';
            document.getElementById('proxyTarget').focus();
        }

        async function deleteProxy(port) {
            try {
                const res = await fetch('/api/proxies?port=' + port, { method: 'DELETE' });
                if (res.ok) fetchProxies();
            } catch (e) { }
        }

        updateStatus();
        fetchProxies();
    </script>
</body>

</html>
