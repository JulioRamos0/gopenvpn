services:
  vpn_servipar:
    build: .
    container_name: vpn_servipar
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    stdin_open: true
    tty: true
    ports:
      - "8081:8080"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
    environment:
      - OPENVPN_PROFILE=${OPENVPN_PROFILE}
    dns:
      - ${VPN_DNS}
      - 8.8.8.8
    volumes:
      - ./data:/data